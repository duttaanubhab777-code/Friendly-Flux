<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chemistry solver</title>
  <link rel="stylesheet" href="chemistry.css">
</head>
<body>
  <div class="calculator-container">
    <h2>Chemistry Problem Solver</h2>
    
    <div class="input-group">
        <label for="chemistry-select">Select a Formula:</label>
        <select id="chemistry-select">
            <option value="">-- Choose here --</option>
            <!-- app.py এর CHEMISTRY_FORMULAS এর নাম অনুযায়ী[span_1](start_span)[span_1](end_span) -->
            <option value="moles">Moles (n = mass / Molar mass)</option>
            <option value="molarity">Molarity (M = moles / Volume)</option>
            <option value="ideal_gas_pressure">Ideal Gas Pressure (P = nRT / V)</option>
        </select>
    </div>

    <!-- ইনপুট বক্সগুলো এখানে নিজে থেকে আসবে -->
    <div id="chemistry-inputs"></div>

    <button id="chemistry-calc-btn" class="calc-btn">Calculate</button>
    
    <div id="chemistry-result" class="result-text"></div>
</div>
<script src="chemistry.js"></script>
</body>
</html>
